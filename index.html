<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C2A25">
<title>Bank Project Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
/* Layout: pine sidebar of sheets + bright working canvas; entries open in a slide-in form drawer */
:root{
  --bg:#F2F6F4; --surface:#FFFFFF; --surface-2:#E8EFEC; --line:#D3DED9; --ink:#10231F; --muted:#5A6E68;
  --accent:#0C8565; --accent-soft:#D5F0E6; --accent-ink:#FFFFFF; --amber:#F2A93B;
  --side:#0C2A25; --side-ink:#DDEDE8; --side-muted:#8FB0A7; --side-hover:#143A33; --side-active:#1B4C42;
  --good:#167E57; --good-bg:#DDF3E8; --warn:#A6640A; --warn-bg:#FCEBCC; --bad:#BF3A31; --bad-bg:#FBE0DD; --neu:#5D6D69; --neu-bg:#E7ECEA; --info:#2F5DA8; --info-bg:#E0E9F8;
  --shadow:0 1px 2px rgba(16,35,31,.06),0 8px 24px rgba(16,35,31,.07);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1412; --surface:#111E1B; --surface-2:#172925; --line:#24403A; --ink:#E3EEEA; --muted:#93AAA3;
  --accent:#3CC99A; --accent-soft:#163D33; --accent-ink:#06261D; --amber:#F2B455;
  --side:#071110; --side-ink:#D7E8E2; --side-muted:#7E9C94; --side-hover:#0F221F; --side-active:#16332D;
  --good:#5BD49F; --good-bg:#123528; --warn:#F2B455; --warn-bg:#3A2A10; --bad:#F2857C; --bad-bg:#3D1B18; --neu:#A3B4AF; --neu-bg:#1E2D2A; --info:#8DB2F2; --info-bg:#172743;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1412; --surface:#111E1B; --surface-2:#172925; --line:#24403A; --ink:#E3EEEA; --muted:#93AAA3;
  --accent:#3CC99A; --accent-soft:#163D33; --accent-ink:#06261D; --amber:#F2B455;
  --side:#071110; --side-ink:#D7E8E2; --side-muted:#7E9C94; --side-hover:#0F221F; --side-active:#16332D;
  --good:#5BD49F; --good-bg:#123528; --warn:#F2B455; --warn-bg:#3A2A10; --bad:#F2857C; --bad-bg:#3D1B18; --neu:#A3B4AF; --neu-bg:#1E2D2A; --info:#8DB2F2; --info-bg:#172743;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100%}
/* Sidebar */
.side{background:var(--side);color:var(--side-ink);padding-block:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.02em}
.brand h1{font-family:var(--f-display);font-size:18px;font-weight:700;margin:0;line-height:1.1}
.brand small{display:block;color:var(--side-muted);font-size:12px;font-weight:500}
.side-label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--side-muted);padding:0 10px;margin-top:4px;display:flex;justify-content:space-between;align-items:center}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;font-size:14px;font-weight:500;color:var(--side-ink)}
.nav button:hover{background:var(--side-hover)}
.nav button[aria-current="true"]{background:var(--side-active);box-shadow:inset 3px 0 0 var(--accent)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .ct{font-family:var(--f-mono);font-size:11px;color:var(--side-muted);background:rgba(255,255,255,.06);padding:1px 7px;border-radius:99px}
.nav .dot{width:8px;height:8px;border-radius:3px;flex:none}
.side-add{all:unset;cursor:pointer;margin-top:4px;padding:10px;border-radius:10px;border:1px dashed rgba(255,255,255,.22);color:var(--side-ink);font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center;justify-content:center}
.side-add:hover{background:var(--side-hover);border-color:var(--accent)}
.side-foot{margin-top:auto;font-size:12px;color:var(--side-muted);padding:0 8px;display:flex;flex-direction:column;gap:8px}
.sync{display:inline-flex;align-items:center;gap:7px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(60,201,154,.18)}
.sync[data-s="saving"] i{background:var(--amber);animation:pulse 1s infinite}
.sync[data-s="local"] i{background:var(--side-muted);box-shadow:none}
.sync[data-s="offline"] i{background:#F2857C}
@keyframes pulse{50%{opacity:.35}}
/* Main */
.main{min-width:0;padding-block:24px 64px;padding-left:max(16px,clamp(16px,3.2vw,44px));padding-right:max(16px,env(safe-area-inset-right,0px),clamp(16px,3.2vw,44px));display:flex;flex-direction:column;gap:22px}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.crumb{font-size:13px;color:var(--muted);flex:1;min-width:0}
.crumb b{color:var(--ink);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-size:14px;font-weight:600;transition:transform .12s, box-shadow .12s, background .12s}
.btn:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2);box-shadow:none;transform:none}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn svg{width:16px;height:16px;flex:none}
.kbd{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:5px;background:rgba(0,0,0,.12);opacity:.8}
.hero{display:flex;flex-direction:column;gap:10px}
.hero h2{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,3.4vw,40px);line-height:1.08;margin:0;letter-spacing:-.01em;text-wrap:balance}
.hero p{margin:0;color:var(--muted);max-width:68ch}
.note{display:flex;gap:12px;align-items:flex-start;background:var(--warn-bg);color:var(--ink);border-radius:14px;padding:12px 14px 12px 16px;font-size:14px;max-width:100ch;border-left:4px solid var(--warn)}
.note .txt{flex:1;min-width:0;white-space:pre-line;overflow-wrap:anywhere}
.note b{flex:none}
.note-edit{display:flex;flex-direction:column;gap:8px;max-width:100ch}
.note-edit .acts{display:flex;gap:8px}
.addnote{all:unset;cursor:pointer;color:var(--muted);font-size:13.5px;font-weight:600;display:inline-flex;gap:6px;align-items:center;padding:4px 8px;border-radius:8px;align-self:flex-start}
.addnote:hover{color:var(--accent);background:var(--surface-2)}
.addnote:focus-visible{outline:2px solid var(--accent)}
/* Red alerts / important rows */
.alert{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--bad-bg);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);border-left:5px solid var(--bad);border-radius:14px;padding:12px 16px}
.alert .ic{width:34px;height:34px;border-radius:10px;background:var(--bad);color:#fff;display:grid;place-items:center;flex:none;font-weight:800}
.alert .msg{flex:1;min-width:200px;display:flex;flex-direction:column}
.alert .msg b{color:var(--bad);font-size:15px}
.alert .msg span{font-size:13px;color:var(--muted)}
.alert .btn{background:var(--surface)}
.alert .btn.on{background:var(--bad);color:#fff;border-color:var(--bad)}
td.c-flag,th.c-flag{width:76px;min-width:76px;padding:0;text-align:center;position:sticky;left:0;z-index:1;background:var(--surface)}
th.c-flag{z-index:3;background:var(--surface-2)}
.flag{all:unset;cursor:pointer;width:30px;height:30px;margin:7px;display:grid;place-items:center;border-radius:8px;color:var(--line)}
.flag svg{width:16px;height:16px}
.flag:hover{color:var(--bad);background:var(--bad-bg)}
.flag:focus-visible{outline:2px solid var(--bad)}
.flag[aria-pressed="true"]{color:#fff;background:var(--bad)}
tbody tr.breach td{background:color-mix(in srgb,var(--bad-bg) 55%,var(--surface))}
tbody tr.imp td{background:var(--bad-bg)}
tbody tr.imp td.c-flag,tbody tr.breach td.c-flag{box-shadow:inset 4px 0 0 var(--bad)}
tbody tr.imp:hover td,tbody tr.breach:hover td{background:color-mix(in srgb,var(--bad) 16%,var(--surface))}
.eta-late{color:var(--bad);font-weight:700}
.eta-late small{display:block;font-size:11px;font-family:var(--f-body)}
.card.imp,.card.breach{border-color:color-mix(in srgb,var(--bad) 55%,var(--line));box-shadow:inset 4px 0 0 var(--bad)}
.card.imp{background:var(--bad-bg)}
.attn{background:var(--surface);border:1px solid color-mix(in srgb,var(--bad) 35%,var(--line));border-radius:16px;overflow:hidden}
.attn button{all:unset;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line);width:100%;box-sizing:border-box}
.attn button:last-child{border-bottom:0}
.attn button:hover{background:var(--bad-bg)}
.attn .tag{grid-row:span 2;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--bad);color:#fff}
.attn .tag.late{background:var(--bad-bg);color:var(--bad)}
.attn .rt{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attn .rs{font-size:12.5px;color:var(--muted)}
.attn .rd{grid-row:span 2;font-family:var(--f-mono);font-size:12px;color:var(--bad);font-weight:600}
.tile .flags{display:flex;gap:6px;flex-wrap:wrap}
.tile.new svg{width:20px;height:20px}
th.c-flag svg{width:14px;height:14px;opacity:.45;vertical-align:middle}
.stamp svg,.addnote svg,.colmenu svg,.alert svg,#drImp svg{width:14px;height:14px;flex:none}
/* Column menu */
th button.colh{gap:6px}
th button.colh .chev{opacity:.4;margin-left:auto}
th button.colh:hover .chev{opacity:1}
.colmenu{position:fixed;z-index:45;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.18);padding:6px;width:250px;display:flex;flex-direction:column}
.colmenu .ttl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:6px 10px 4px;font-weight:700}
.colmenu button{all:unset;cursor:pointer;padding:8px 10px;border-radius:8px;font-size:14px;display:flex;gap:8px;align-items:center}
.colmenu button:hover,.colmenu button:focus-visible{background:var(--surface-2)}
.colmenu button.red{color:var(--bad)}
.colmenu button.red.armed{background:var(--bad);color:#fff}
.colmenu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.colmenu .rn{display:flex;gap:6px;padding:6px}
.colmenu .rn input{flex:1;min-width:0;padding:7px 10px}
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);padding-block:8px;margin-block:-8px}
.dlwarn{background:var(--warn-bg);border-radius:12px;padding:12px 14px;font-size:13.5px;display:flex;flex-direction:column;gap:8px}
.dlwarn b{color:var(--warn)}
.note b{color:var(--warn)}
.stats{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;min-width:130px}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums}
.dist{flex:1;min-width:260px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.dist .bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface-2);gap:2px}
.dist .bar span{display:block;height:100%;transition:width .4s}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12.5px;font-weight:600;border:1px solid transparent}
.chip:focus-visible{outline:2px solid var(--accent)}
.chip .n{font-family:var(--f-mono);font-size:11px;opacity:.8}
.chip[aria-pressed="true"]{border-color:currentColor;box-shadow:0 0 0 2px var(--surface) inset}
.chip[aria-pressed="false"].dim{opacity:.55}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.t-good{color:var(--good);background:var(--good-bg)} .t-warn{color:var(--warn);background:var(--warn-bg)} .t-bad{color:var(--bad);background:var(--bad-bg)} .t-neu{color:var(--neu);background:var(--neu-bg)} .t-info{color:var(--info);background:var(--info-bg)}
.b-good{background:var(--good)} .b-warn{background:var(--warn)} .b-bad{background:var(--bad)} .b-neu{background:var(--neu)} .b-info{background:var(--info)}
/* Toolbar */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search input{border:0;outline:0;background:transparent;padding:10px 0;flex:1;min-width:0}
.search svg{width:16px;height:16px;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button:focus-visible{outline:2px solid var(--accent)}
/* Table */
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:auto;max-height:calc(100vh - 140px);box-shadow:var(--shadow)}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:14px}
th{position:sticky;top:0;z-index:2;background:var(--surface-2);text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding:0;border-bottom:1px solid var(--line);white-space:nowrap}
th button{all:unset;cursor:pointer;display:flex;gap:6px;align-items:center;padding:11px 14px;width:100%;box-sizing:border-box}
th button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
tbody tr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
tbody tr.flash td{animation:flash 1.4s ease-out}
@keyframes flash{from{background:var(--accent-soft)}}
td.c-long{min-width:280px;max-width:420px}
td.c-text{min-width:140px;max-width:260px}
td.c-select{min-width:120px}
td.c-date,td.c-number{font-family:var(--f-mono);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.empty-cell{color:var(--line)}
/* Cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px}
.card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;transition:transform .15s, box-shadow .15s, border-color .15s;min-width:0}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.card:focus-visible{outline:2px solid var(--accent)}
.card h3{font-family:var(--f-display);font-size:18px;font-weight:700;margin:0;line-height:1.2;overflow-wrap:anywhere}
.card .meta{display:flex;flex-wrap:wrap;gap:6px}
.card dl{margin:0;display:flex;flex-direction:column;gap:8px}
.card dt{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.card dd{margin:0;font-size:14px;overflow-wrap:anywhere}
.card dd .clamp{-webkit-line-clamp:4}
.card .when{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
/* Home */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;transition:transform .15s, box-shadow .15s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.tile:focus-visible{outline:2px solid var(--accent)}
.tile h3{margin:0;font-family:var(--f-display);font-size:17px;font-weight:700;line-height:1.2}
.tile .big{font-family:var(--f-display);font-size:34px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.tile .big small{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--muted);margin-left:6px}
.tile .bar{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--surface-2);gap:2px}
.tile .bar span{display:block}
.tile .sub{font-size:12.5px;color:var(--muted)}
.tile.new{border-style:dashed;align-items:center;justify-content:center;color:var(--accent);font-weight:700;min-height:150px;background:transparent}
.section-h{font-family:var(--f-display);font-size:20px;font-weight:700;margin:6px 0 0}
.recent{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.recent button{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 16px;border-bottom:1px solid var(--line);width:100%;box-sizing:border-box}
.recent button:last-child{border-bottom:0}
.recent button:hover{background:var(--surface-2)}
.recent .rt{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recent .rs{font-size:12.5px;color:var(--muted)}
.recent .rd{font-family:var(--f-mono);font-size:12px;color:var(--muted);grid-row:span 2;align-self:center}
.emptystate{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:40px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.emptystate h3{font-family:var(--f-display);font-size:22px;margin:0}
.emptystate p{margin:0;color:var(--muted);max-width:52ch}
/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(6,20,17,.42);backdrop-filter:blur(2px);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;transform:translateX(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:-20px 0 60px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.open{transform:none}
.dr-head{padding:20px 24px 14px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line);background:var(--surface)}
.dr-head .eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:700}
.dr-head h2{margin:0;font-family:var(--f-display);font-size:24px;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.dr-head .x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px))}
.progress{height:4px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--amber));transition:width .3s}
.dr-body{flex:1;overflow:auto;padding:20px 24px 28px;display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:7px}
.field label,.field .lbl{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;justify-content:space-between}
.field .typ{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.inp{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 13px;transition:border-color .15s, box-shadow .15s}
.inp:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
textarea.inp{min-height:96px;resize:vertical;line-height:1.55}
.field.filled .inp{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.stamp{all:unset;cursor:pointer;font-size:12px;font-weight:600;color:var(--accent);padding:2px 8px;border-radius:6px}
.stamp:hover{background:var(--accent-soft)}
.stamp:focus-visible{outline:2px solid var(--accent)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{all:unset;cursor:pointer;padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600;border:1.5px solid var(--line);background:var(--surface);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-sizing:border-box}
.opt:hover{border-color:var(--accent)}
.opt:focus-visible{outline:2px solid var(--accent)}
.opt[aria-pressed="true"]{border-color:currentColor}
.opt.addopt{border-style:dashed;color:var(--muted)}
.opts .opt.t-good{background:var(--good-bg);color:var(--good)} .opts .opt.t-warn{background:var(--warn-bg);color:var(--warn)} .opts .opt.t-bad{background:var(--bad-bg);color:var(--bad)} .opts .opt.t-neu{background:var(--neu-bg);color:var(--neu)} .opts .opt.t-info{background:var(--info-bg);color:var(--info)}
.dr-foot{padding:14px 24px;border-top:1px solid var(--line);background:var(--surface);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dr-foot .sp{flex:1}
.hint{font-size:12px;color:var(--muted)}
/* Modal */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(6,20,17,.45);backdrop-filter:blur(3px)}
.modal[hidden]{display:none!important}
.mbox{background:var(--bg);border-radius:20px;width:min(720px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.3);overflow:hidden}
.mbox .dr-body{gap:16px}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tpl{all:unset;cursor:pointer;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;box-sizing:border-box}
.tpl b{font-size:14px}
.tpl span{font-size:12px;color:var(--muted)}
.tpl[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tpl:focus-visible{outline:2px solid var(--accent)}
.colrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.9fr) auto;gap:8px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.colrow .optsin{grid-column:1/-1}
.colrow .acts{display:flex;gap:2px}
.icon{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
.icon:hover{background:var(--surface-2);color:var(--ink)}
.icon:focus-visible{outline:2px solid var(--accent)}
.icon svg{width:16px;height:16px}
.cols{display:flex;flex-direction:column;gap:8px}
/* Toast + confetti */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:60;display:flex;gap:8px;align-items:center;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
.menu{position:relative;display:inline-block}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:200px;z-index:30;display:flex;flex-direction:column}
.menu-pop button{all:unset;cursor:pointer;padding:8px 10px;border-radius:8px;font-size:14px}
.menu-pop button:hover,.menu-pop button:focus-visible{background:var(--surface-2)}
.menu-pop button.red{color:var(--bad)}
.banner{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:8px 12px}
/* Tracker switcher */
.trk{position:relative}
.trk-btn{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:6px;border-radius:12px;width:100%;box-sizing:border-box}
.trk-btn:hover{background:var(--side-hover)}
.trk-btn:focus-visible{outline:2px solid var(--accent)}
.trk-btn b{font-family:var(--f-display);font-size:17px;font-weight:700;display:block;line-height:1.15}
.trk-btn small{display:block;color:var(--side-muted);font-size:12px;font-weight:500}
.trk-pop{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;z-index:35;display:flex;flex-direction:column;gap:2px;min-width:230px}
.trk-pop button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;font-size:14px}
.trk-pop button:hover,.trk-pop button:focus-visible{background:var(--surface-2)}
.trk-pop .mini{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:800;font-size:10.5px;flex:none}
.trk-pop .sub{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.trk-pop hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.trk-pop .add{color:var(--accent);font-weight:700}
/* Choice cards + checklists */
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.choice{all:unset;cursor:pointer;box-sizing:border-box;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.choice b{font-size:14px}
.choice span{font-size:12px;color:var(--muted)}
.choice[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.choice:focus-visible{outline:2px solid var(--accent)}
.group{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.ck{display:flex;align-items:center;gap:10px;padding:5px 4px;border-radius:8px;cursor:pointer;font-size:14px}
.ck:hover{background:var(--surface-2)}
.ck input{width:17px;height:17px;accent-color:var(--accent);flex:none}
.ck .n{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.ck.head{font-weight:700}
.group .kids{display:flex;flex-direction:column;padding-left:22px}
th.addcol{background:var(--surface-2)}
th.addcol button{color:var(--accent);justify-content:center}
/* Filters + calculated */
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fchip{display:inline-flex;align-items:center;border-radius:99px;background:var(--accent-soft);color:var(--ink);font-size:13px;font-weight:600;overflow:hidden;max-width:100%}
.fchip button{all:unset;cursor:pointer;padding:6px 4px 6px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
.fchip button.x{padding:6px 10px 6px 6px;color:var(--muted)}
.fchip button:hover{color:var(--accent)}
.fchip button:focus-visible{outline:2px solid var(--accent)}
.badge{font-family:var(--f-mono);font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 7px;line-height:18px}
td.c-calc{white-space:nowrap;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
th .fx{font-family:var(--f-mono);font-size:10px;color:var(--accent);border:1px solid currentColor;border-radius:4px;padding:0 3px;letter-spacing:0}
.calcbox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface-2);border:1.5px dashed var(--line);border-radius:12px;padding:10px 13px;font-size:14px}
.calcbox small{color:var(--muted);font-size:12px}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;grid-column:1/-1}
.cfg label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.fvals{display:flex;flex-direction:column;gap:2px;max-height:260px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.row2>*{flex:1;min-width:140px}
/* Themes */
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.skin{all:unset;cursor:pointer;box-sizing:border-box;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.skin[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.skin:focus-visible{outline:2px solid var(--accent)}
.skin .pv{display:grid;grid-template-columns:30% 1fr;height:74px}
.skin .pv .sb{display:flex;flex-direction:column;gap:5px;padding:9px 7px}
.skin .pv .sb i{display:block;height:5px;border-radius:3px;opacity:.55}
.skin .pv .sb i:first-child{opacity:1}
.skin .pv .cv{padding:9px;display:flex;flex-direction:column;gap:6px}
.skin .pv .cv i{display:block;height:6px;border-radius:3px}
.skin .pv .cv b{display:block;width:48%;height:14px;border-radius:5px;margin-top:auto}
.skin .nm{padding:8px 10px;font-size:13.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.skin .nm small{font-weight:500;color:var(--muted);font-size:11.5px}
:root[data-density="compact"] td{padding:6px 12px}
:root[data-density="compact"] th button{padding:8px 12px}
:root[data-density="compact"] .card{padding:12px 14px;gap:7px}
:root[data-density="compact"] .main{gap:16px}
:root[data-density="compact"] .clamp{-webkit-line-clamp:2}
.app.noside{grid-template-columns:minmax(0,1fr)}
.app.noside .side{display:none}
.sidetog svg{width:18px;height:18px}
/* Inline cell editing */
tbody tr{cursor:default}
td.editable{cursor:pointer;transition:box-shadow .1s}
td.editable:hover{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 55%,transparent);border-radius:6px}
td.editing{box-shadow:inset 0 0 0 2px var(--accent)!important}
.rowacts{display:flex;justify-content:center}
.flag.open{color:var(--muted);opacity:0}
tr:hover .flag.open,.flag.open:focus-visible{opacity:1}
.flag.open:hover{color:var(--accent);background:var(--accent-soft)}
.cellpop{position:fixed;z-index:46;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.2);padding:12px;width:min(360px,calc(100vw - 24px));display:flex;flex-direction:column;gap:10px}
.cellpop.wide{width:min(560px,calc(100vw - 24px))}
.cellpop .ttl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.cellpop .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cellpop .acts .sp{flex:1}
.cellpop .opts{max-height:260px;overflow:auto}
.cellpop textarea{min-height:140px}
/* Undo toast, bulk bar, paste */
.toast.undo{pointer-events:auto}
body:has(.bulkbar) .toast{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
.toast button{all:unset;cursor:pointer;margin-left:6px;padding:4px 10px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px}
.toast button:focus-visible{outline:2px solid var(--bg)}
td.c-flag,th.c-flag{width:104px!important;min-width:104px!important}
.rowck{width:16px;height:16px;accent-color:var(--accent);margin:0 2px 0 6px;cursor:pointer;flex:none}
.rowacts{align-items:center}
tbody tr.sel td{background:color-mix(in srgb,var(--accent-soft) 70%,var(--surface))}
.bulkbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:44;background:var(--ink);color:var(--bg);border-radius:16px;padding:8px 8px 8px 16px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;box-shadow:0 18px 50px rgba(0,0,0,.3);max-width:calc(100% - 32px)}
.bulkbar b{font-size:14px;margin-right:6px;white-space:nowrap}
.bulkbar button{all:unset;cursor:pointer;padding:7px 12px;border-radius:10px;font-size:13.5px;font-weight:600;white-space:nowrap}
.bulkbar button:hover,.bulkbar button:focus-visible{background:rgba(127,127,127,.25)}
.bulkbar button.danger{color:#FF8A80}
.pastebox{min-height:120px;font-family:var(--f-mono);font-size:12.5px;white-space:pre}
.maptbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.maptbl table{font-size:13px;width:max-content;min-width:100%}
.maptbl th{position:static;padding:8px;background:var(--surface-2);text-transform:none;letter-spacing:0;font-size:12px}
.maptbl th select{min-width:140px;padding:6px 8px;font-size:12.5px}
.maptbl td{padding:6px 10px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:default}
.hol-list{display:flex;flex-direction:column;gap:4px;max-height:280px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px}
.hol-row{display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:10px;align-items:center;padding:4px 6px;border-radius:8px;font-size:14px}
.hol-row:hover{background:var(--surface-2)}
.hol-row .d{font-family:var(--f-mono);font-size:12.5px}
.hol-row .wk{font-size:11px;color:var(--muted);margin-left:6px}
/* Font picker + contrast */
.fontgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;max-height:330px;overflow:auto;padding:2px}
.fontc{gap:4px}
:root[data-contrast="max"] .pill,:root[data-contrast="max"] .opt[aria-pressed="true"]{font-weight:700;box-shadow:inset 0 0 0 1.5px currentColor}
:root[data-contrast="max"] .inp,:root[data-contrast="high"] .inp{border-color:var(--muted)}
:root[data-contrast="max"] .btn{border-color:var(--muted)}
:root[data-contrast="max"] th{color:var(--ink)}
/* Sign-in / setup gate */
.gate{position:fixed;inset:0;z-index:90;background:var(--side);display:grid;place-items:center;padding:24px 16px;overflow:auto}
.gate[hidden]{display:none!important}
.gate .card{background:var(--surface);color:var(--ink);border-radius:22px;padding:28px;width:min(460px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.gate h1{font-family:var(--f-display);font-size:26px;margin:0;line-height:1.15}
.gate p{margin:0;color:var(--muted);font-size:14px}
.gate .or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.1em}
.gate .or::before,.gate .or::after{content:"";flex:1;border-top:1px solid var(--line)}
.gate .err{color:var(--bad);font-size:13px;font-weight:600}
.gate .ok{color:var(--good);font-size:13px;font-weight:600}
.gate .btn{justify-content:center;padding:11px 14px}
.gate code,.gate pre{font-family:var(--f-mono);font-size:12px;background:var(--surface-2);border-radius:8px;padding:2px 6px}
.gate textarea{font-family:var(--f-mono);font-size:12px;min-height:150px}
.userchip{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--side-muted);overflow:hidden}
.userchip span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.userchip button{all:unset;cursor:pointer;color:var(--side-ink);font-weight:600;padding:3px 8px;border-radius:6px;border:1px solid rgba(255,255,255,.2)}
/* Sheet tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-top:-6px;scrollbar-width:thin}
.tab{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap;border-radius:8px 8px 0 0;flex:none}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);background:var(--surface)}
.tab .dot{width:8px;height:8px;border-radius:3px}
.tab .nm{max-width:220px;overflow:hidden;text-overflow:ellipsis}
.tab .ct{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--muted);background:var(--surface-2);padding:0 6px;border-radius:99px}
.tab .red{font-family:var(--f-mono);font-size:11px;font-weight:700;color:#fff;background:var(--bad);padding:0 6px;border-radius:99px}
.tab.add svg{width:16px;height:16px}
.tabw{display:inline-flex;flex:none}
.tabw.dragging,th.dragging{opacity:.4}
.tabw.drop-l .tab,th.drop-l{box-shadow:inset 3px 0 0 var(--accent)}
.tabw.drop-r .tab,th.drop-r{box-shadow:inset -3px 0 0 var(--accent)}
th[draggable="true"] button{cursor:grab}
/* Full screen */
.app.full{grid-template-columns:minmax(0,1fr)}
.app.full .side{display:none}
.app.full .main{padding-block:14px 24px;gap:14px}
.app.full .hero h2{font-size:26px}
.app.full .sidetog{display:none}
.app.full .tablewrap{max-height:calc(100vh - 210px)}
/* Mobile */
/* ---------- Tablet & phone ---------- */
.sidescrim{display:none}
.crumb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (hover:none){.flag.open{opacity:1} .kbd{display:none} .side-foot>span:last-child{display:none}}
@media (max-width:1024px){
  .app,.app.noside,.app.full{grid-template-columns:minmax(0,1fr)}
  .side,.app.noside .side,.app.full .side{display:flex;position:fixed;top:0;left:0;bottom:0;height:100%;width:min(300px,86vw);z-index:48;transform:translateX(-105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);box-shadow:20px 0 60px rgba(0,0,0,.25);padding-top:calc(22px + env(safe-area-inset-top,0px));padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
  .app.sideopen .side{transform:none}
  .app.sideopen .sidescrim{display:block;position:fixed;inset:0;z-index:47;background:rgba(6,20,17,.42)}
  .app.full .sidetog{display:inline-flex}
  .tablewrap{max-height:none}
  .colrow{grid-template-columns:1fr}
}
@media (max-width:760px){
  .bl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .topbar{gap:4px;flex-wrap:nowrap}
  .topbar .btn{padding:8px 10px}
  .main{gap:16px;padding-block:14px 96px}
  .hero h2{font-size:24px}
  .stats{display:grid;grid-template-columns:1fr 1fr}
  .stat{min-width:0}
  .toolbar{gap:8px}
  .toolbar .search{flex:1 1 100%;order:-1}
  .toolbar .btn{padding:8px 11px}
  .toolbar .seg{order:0}
  .alert{padding:12px}
  .alert .btn{flex:1 1 auto;justify-content:center}

/* ---------- Paste rows from Excel ---------- */
function parseTSV(t) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"' && cell === "") q = true;
    else if (ch === "\t") { row.push(cell); cell = ""; }
    else if (ch === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
    else if (ch !== "\r") cell += ch;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows.map(r => r.map(c => c.trim())).filter(r => r.some(Boolean));
}
const MONS = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,sept:8,oct:9,nov:10,dec:11};

  let m;
  if ((m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(v))) return iso(new Date(+m[1], m[2] - 1, +m[3]));
  if ((m = /^(\d{1,2})[\s\-\/.]([A-Za-z]{3,4})[A-Za-z]*[\s\-\/.,]*(\d{2,4})$/.exec(v)) && MONS[m[2].toLowerCase()] != null) { let y = +m[3]; if (y < 100) y += 2000; return iso(new Date(y, MONS[m[2].toLowerCase()], +m[1])); }
  if ((m = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/.exec(v))) { let y = +m[3]; if (y < 100) y += 2000; return iso(new Date(y, m[2] - 1, +m[1])); }
  if ((m = /^(\d{1,2})(?:st|nd|rd|th)?\s+([A-Za-z]{3,})\s*,?\s*(\d{4})?$/.exec(v)) && MONS[m[2].slice(0, 3).toLowerCase()] != null) return iso(new Date(m[3] ? +m[3] : new Date().getFullYear(), MONS[m[2].slice(0, 3).toLowerCase()], +m[1]));
  if (/^\d{5}$/.test(v)) { const d = new Date(Date.UTC(1899, 11, 30) + (+v) * 86400000); return iso(new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())); }
  return v;
}
function openPaste(text) {

    P.header = P.headerSet ?? (hits >= Math.min(2, first.length));

  };

      <tbody>${body.slice(0, 5).map(r => `<tr>${P.map.map((m, j) => { const c = cols.find(x => x.id === m); const v = c?.type === "date" ? fmtDate(normDate(r[j])) : r[j]; return `<td title="${esc(r[j] || "")}" style="${m ? "" : "opacity:.4"}">${esc(v || "")}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div>${body.length > 5 ? `<span class="hint">…and ${body.length - 5} more rows</span>` : ""}</div>

    body: () => `<div class="field"><label for="ps_txt">Pasted cells</label><textarea class="inp pastebox" id="ps_txt" placeholder="Click here and press Ctrl+V">${esc(text)}</textarea></div><div id="ps_prev">${preview()}</div>`,
    mount: root => {

/* ---------- Holiday calendar ---------- */
const WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

/* ---------- Backup & restore (JSON) ---------- */

    eyebrow: "Data", title: "Backup & restore", saveLabel: "Done",

      <div class="field"><span class="lbl">Restore from a backup file</span><p class="hint" style="margin:0">Adds or overwrites trackers, sheets and entries with the same IDs. Nothing else is deleted.</p><input class="inp" type="file" id="bkFile" accept=".json,application/json"><div id="bkMsg" class="hint"></div><button class="btn primary" type="button" id="bkGo" style="align-self:flex-start" disabled>Restore</button></div>`,
    mount: root => {
      let data = null;
      root.querySelector("#bkDl").onclick = () => DL.save({filename: `tracker-backup-${todayISO()}.json`, data: JSON.stringify({exportedAt: new Date().toISOString(), trackers: S.trackers, sheets: S.sheets, rows: S.rows}, null, 1)});
      root.querySelector("#bkFile").onchange = async e => {

          root.querySelector("#bkMsg").textContent = `Ready: ${Object.keys(j.trackers || {}).length} trackers, ${Object.keys(j.sheets).length} sheets, ${Object.keys(j.rows).length} entries.`; root.querySelector("#bkGo").disabled = false; }

      root.querySelector("#bkGo").onclick = async () => {

        const snaps = [], tasks = [];

}

/* ---------- Column header menu ---------- */
let CM = null;

function openColMenu(colId, anchor) {
  closeColMenu();

  CM = {colId};
  const m = document.createElement("div"); m.className = "colmenu"; m.id = "colMenu"; m.setAttribute("role", "menu");
  m.innerHTML = `<div class="ttl">${esc(TYPES[c.type] || "")}${c.type === "calc" ? " · " + esc(CALC[c.calc?.kind]?.name || "") : ""}</div>
    <div class="rn"><input class="inp" id="cmName" value="${esc(c.label)}" aria-label="Column name"><button class="btn primary" type="button" data-cm="rename">Rename</button></div><hr>
    <button type="button" data-cm="asc">↑ Sort ascending</button><button type="button" data-cm="desc">↓ Sort descending</button>
    <button type="button" data-cm="filter">${ICON.filter} Filter by this column</button>
    ${c.type === "date" ? `<button type="button" data-cm="aging">⏱ Add aging from this date</button>` : ""}
    ${c.type === "calc" || c.type === "select" ? `<button type="button" data-cm="edit">✎ Edit ${c.type === "calc" ? "calculation" : "dropdown options"}</button>` : ""}
    <hr><button type="button" data-cm="left" ${i === 0 ? "disabled style='opacity:.4'" : ""}>← Move left</button><button type="button" data-cm="right" ${i === cols.length - 1 ? "disabled style='opacity:.4'" : ""}>→ Move right</button>
    <hr><button type="button" class="red" data-cm="delete">${ICON.trash} Delete column</button>`;
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect();
  m.style.top = Math.min(innerHeight - m.offsetHeight - 8, r.bottom + 4) + "px";
  m.style.left = Math.max(8, Math.min(innerWidth - m.offsetWidth - 8, r.left)) + "px";
  const nm = m.querySelector("#cmName"); nm.focus({preventScroll: true}); nm.select();
  nm.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); m.querySelector('[data-cm="rename"]').click(); } if (e.key === "Escape") { e.stopPropagation(); closeColMenu(); } });
  m.addEventListener("click", e => {
    const b = e.target.closest("[data-cm]"); if (!b || b.disabled) return;
    const sh2 = S.sheets[S.sheetId], cs = [...(sh2.columns || [])], j = cs.findIndex(x => x.id === colId);
    const save = (next, msg) => { store.put("sheets", S.sheetId, {...sh2, columns: next}); closeColMenu(); toast(msg); render(); };
    switch (b.dataset.cm) {
      case "rename": { const v = nm.value.trim(); if (!v) { toast("Column name can't be empty"); return; } if (v === cs[j].label) { closeColMenu(); return; } cs[j] = {...cs[j], label: v}; save(cs, `Renamed to “${v}”`); break; }
      case "asc": case "desc": S.sort = {sheet: S.sheetId, col: colId, dir: b.dataset.cm === "asc" ? 1 : -1}; closeColMenu(); render(); break;
      case "filter": closeColMenu(); openFilter(null, colId); break;
      case "aging": closeColMenu(); openAddColumn("aging", colId); break;
      case "edit": closeColMenu(); openModal(S.sheetId); break;
      case "left": case "right": { const k = b.dataset.cm === "left" ? j - 1 : j + 1; [cs[j], cs[k]] = [cs[k], cs[j]]; save(cs, "Column moved"); break; }
      case "delete": if (!b.classList.contains("armed")) { b.classList.add("armed"); b.innerHTML = "Click again to delete this column"; return; } cs.splice(j, 1); save(cs, `Column “${c.label}” deleted`); break;
    }
  });
}
document.addEventListener("mousedown", e => { if (CM && !e.target.closest("#colMenu") && !e.target.closest("[data-colmenu]")) closeColMenu(); });

/* ---------- Drawer (entry form) ---------- */
let D = null; // {sheetId, rowId, cells}
const drawerOpen = () => $("#drawer").classList.contains("open");
function openDrawer(sheetId, rowId, preset) {
  const sh = S.sheets[sheetId]; if (!sh) return;
  const cols = sh.columns || [];
  let cells = rowId ? {...(S.rows[rowId]?.cells || {})} : {...(preset || {})};
  if (!rowId && !preset) {
    cols.forEach(c => { if (c.type === "number" && /^(sr|sl|s\.?no|#|no)/i.test(c.label)) { const mx = rowsOf(sheetId).reduce((m, r) => Math.max(m, +(r.cells || {})[c.id] || 0), 0); cells[c.id] = String(mx + 1); } });
  }

  paintImp();
  $("#drEyebrow").textContent = sh.name;
  $("#drTitle").textContent = rowId ? (cells[titleCol(sh)?.id] || "Edit entry") : "New entry";
  $("#drDelete").hidden = !rowId; $("#drDup").hidden = !rowId; $("#drSaveNext").hidden = !!rowId;
  $("#drDelete").classList.remove("armed"); $("#drDelete").textContent = "Delete";
  const f = $("#drForm");
  f.innerHTML = cols.map(c => {
    const v = cells[c.id] ?? "", id = `f_${c.id}`;
    let ctl;
    if (c.type === "calc") return `<div class="field" data-calc="${esc(c.id)}"><div class="lbl"><span>${esc(c.label)} <span class="typ">Auto-calculated</span></span></div><div class="calcbox"><span class="cv"></span><small>${esc(calcDesc(sh, c))}</small></div></div>`;
    if (c.type === "long") ctl = `<textarea class="inp" id="${id}" data-col="${esc(c.id)}" rows="4" placeholder="Write the latest update…">${esc(v)}</textarea>`;
    else if (c.type === "date") ctl = `<input class="inp" type="date" id="${id}" data-col="${esc(c.id)}" value="${esc(/^\d{4}-\d{2}-\d{2}$/.test(v) ? v : "")}">`;
    else if (c.type === "number") ctl = `<input class="inp" type="number" id="${id}" data-col="${esc(c.id)}" value="${esc(v)}" style="max-width:160px;font-family:var(--f-mono)">`;
    else if (c.type === "select") {
      const opts = [...new Set([...(c.options || []), ...(v ? [v] : [])])];
      ctl = `<div class="opts" role="group" aria-labelledby="l_${esc(c.id)}" data-sel="${esc(c.id)}">${opts.map(o => `<button type="button" class="opt ${v === o ? "t-" + tone(o) : ""}" aria-pressed="${v === o}" data-v="${esc(o)}" title="${esc(o)}">${esc(o)}</button>`).join("")}<button type="button" class="opt addopt" data-addopt="${esc(c.id)}">+ Other…</button></div><input class="inp" id="${id}" data-newopt="${esc(c.id)}" placeholder="Type a new option and press Enter" hidden>`;
    } else ctl = `<input class="inp" id="${id}" data-col="${esc(c.id)}" value="${esc(v)}">`;
    const stamp = c.type === "long" ? `<button type="button" class="stamp" data-stamp="${esc(c.id)}" title="Add a dated line at the top">+ Today's update</button>` : "";
    return `<div class="field ${v ? "filled" : ""}" data-field="${esc(c.id)}"><div class="lbl"><label id="l_${esc(c.id)}" for="${id}">${esc(c.label)} <span class="typ">${esc(TYPES[c.type] || "")}</span></label>${stamp}</div>${ctl}</div>`;
  }).join("") + (rowId && S.rows[rowId]?.updatedAt ? `<div class="hint">Last saved ${esc(ago(S.rows[rowId].updatedAt))}${S.rows[rowId].updatedBy ? ` by ${esc(S.rows[rowId].updatedBy)}` : ""}</div>` : "");
  f.querySelectorAll("textarea").forEach(autogrow);
  updateProgress();
  $("#drawer").classList.add("open"); $("#drawer").setAttribute("aria-hidden", "false"); $("#scrim").classList.add("open");
  setTimeout(() => { const first = f.querySelector(rowId ? "textarea, input:not([hidden])" : "input:not([hidden]):not([type=number]), textarea"); first?.focus(); }, 120);
}
function autogrow(t) { t.style.height = "auto"; t.style.height = Math.min(420, t.scrollHeight + 4) + "px"; }
function updateProgress() {
  const sh = {id: D.sheetId, ...S.sheets[D.sheetId]}, all = sh.columns || [], cols = all.filter(c => c.type !== "calc"); const n = cols.filter(c => String(D.cells[c.id] || "").trim()).length;
  const pr = {id: D.rowId || "__new", cells: D.cells, updatedAt: D.rowId ? S.rows[D.rowId]?.updatedAt : new Date().toISOString()};
  document.querySelectorAll("#drForm [data-calc]").forEach(el => { const c = all.find(x => x.id === el.dataset.calc), v = calcCell(sh, c, pr); el.querySelector(".cv").innerHTML = v.text ? (v.t === "plain" ? `<b>${esc(v.text)}</b>` : `<span class="pill t-${v.t}">${esc(v.text)}</span>`) : `<span style="color:var(--muted)">Fill the linked fields to calculate</span>`; });
  $("#drProg").style.width = (cols.length ? n / cols.length * 100 : 0) + "%";
  document.querySelectorAll("#drForm .field").forEach(el => el.classList.toggle("filled", !!String(D.cells[el.dataset.field] || "").trim()));
}
function closeDrawer(force) {
  if (!D) return;
  if (!force && JSON.stringify(D.cells) !== D.orig) {
    const h = $("#drHint"); if (h.dataset.warn !== "1") { h.dataset.warn = "1"; h.textContent = "Unsaved changes. Press Esc again to discard."; h.style.color = "var(--warn)"; return; }
  }
  $("#drHint").dataset.warn = ""; $("#drHint").textContent = "Ctrl + Enter to save"; $("#drHint").style.color = "";
  $("#drawer").classList.remove("open"); $("#drawer").setAttribute("aria-hidden", "true"); $("#scrim").classList.remove("open");
  D = null; render();
}
async function saveDrawer(next) {
  if (!D) return;
  const sh = S.sheets[D.sheetId], cells = {};
  Object.entries(D.cells).forEach(([k, v]) => { v = String(v ?? "").trim(); if (v) cells[k] = v; });
  if (!Object.keys(cells).length) { toast("Fill in at least one field first"); return; }
  const sc = statusCol(sh), wasGood = D.rowId && tone(S.rows[D.rowId]?.cells?.[sc?.id]) === "good";
  const isGood = sc && cells[sc.id] && tone(cells[sc.id]) === "good";
  // remember new select options on the sheet
  let colsChanged = false;
  const cols = (sh.columns || []).map(c => { if (c.type === "select" && cells[c.id] && !(c.options || []).includes(cells[c.id])) { colsChanged = true; return {...c, options:[...(c.options || []), cells[c.id]]}; } return c; });
  if (colsChanged) store.put("sheets", D.sheetId, {...sh, columns: cols});
  const id = D.rowId || uid("r");
  const order = D.rowId ? S.rows[D.rowId].order : rowsOf(D.sheetId).reduce((m, r) => Math.max(m, r.order || 0), 0) + 1;
  const sheetId = D.sheetId, isNew = !D.rowId;
  const sn = snap("rows", [id]).concat(colsChanged ? [] : []);
  store.put("rows", id, {sheetId, order, cells, imp: !!D.imp, updatedAt: new Date().toISOString()});
  if (isGood && !wasGood) confetti();
  pushUndo(isNew ? "Entry added" : "Changes saved", sn);
  if (next) { D.orig = JSON.stringify(D.cells); openDrawer(sheetId, null); renderNav(); }
  else { closeDrawer(true); S.view = "sheet"; S.sheetId = sheetId; render(); requestAnimationFrame(() => { const tr = document.getElementById("row-" + id); if (tr) { tr.classList.add("flash"); tr.scrollIntoView({block:"nearest"}); } }); }
}

/* ---------- Import / export ---------- */
function inferSheet(name, aoa) {

  if (!rows.length) return null;
  let note = "";

  const header = rows[0], body = rows.slice(1), width = Math.max(...rows.map(r => r.length));
  const keep = []; for (let i = 0; i < width; i++) if (header[i] || body.some(r => r[i])) keep.push(i);
  const columns = keep.map((i, n) => {
    const label = header[i] || `Column ${n + 1}`, vals = body.map(r => r[i]).filter(Boolean), avg = vals.reduce((s, v) => s + v.length, 0) / Math.max(1, vals.length), distinct = [...new Set(vals)];
    let type = "text";

    else if (/^(sr|sl|s\.?no)/i.test(label) && vals.every(v => /^\d+$/.test(v))) type = "number";
    else if (avg > 55) type = "long";
    else if (distinct.length <= 8 && vals.length > distinct.length && avg < 30 && !/aging|owner|name/i.test(label)) type = "select";
    const c = {id: uid("c"), label, type}; if (type === "select") c.options = distinct.sort(); return c;
  });
  const firstDate = columns.find(c => c.type === "date");
  columns.forEach(c => { if (firstDate && /aging|ageing|days open/i.test(c.label) && c.type !== "date") { c.type = "calc"; c.calc = {kind: "aging", a: firstDate.id, warn: 15, alert: 30}; delete c.options; } });
  return {name, note, columns, body: body.map(r => { const cells = {}; keep.forEach((i, n) => { if (r[i] && columns[n].type !== "calc") cells[columns[n].id] = r[i]; }); return cells; }).filter(c => Object.keys(c).length)};
}

  graphite:{name:"Graphite", mood:"Minimal",        light:P("#F4F4F2","#FFFFFF","#EAEAE6","#D8D8D2","#63635C","#1F1F1C","#E4E4DE","#FFFFFF","#1A1A18","#E9E9E4","#9C9C94","#262623","#33332F"), dark:P("#0E0E0D","#171716","#1F1F1D","#30302D","#A3A39B","#F2B13B","#3A2E15","#1A1204","#080807","#E6E6E0","#8E8E86","#141413","#22221F")},
};
let TH = {skin:"jade", mode:"system", density:"comfy", contrast:"std", font:"figtree", headFont:"display"};
const FONTS = {
  figtree:  {name:"Figtree", w:"400;500;600;700", note:"Default · friendly"},
  inter:    {name:"Inter", w:"400;500;600;700", note:"Crisp UI standard"},
  roboto:   {name:"Roboto", w:"400;500;700", note:"Android / Google"},
  opensans: {name:"Open Sans", w:"400;500;600;700", note:"Neutral, very readable"},
  lato:     {name:"Lato", w:"400;700", note:"Warm, rounded"},
  poppins:  {name:"Poppins", w:"400;500;600;700", note:"Geometric, bold"},
  montserrat:{name:"Montserrat", w:"400;500;600;700", note:"Wide, modern"},
  nunito:   {name:"Nunito", w:"400;500;600;700", note:"Soft, rounded"},
  source:   {name:"Source Sans 3", w:"400;500;600;700", note:"Compact, clear"},
  plex:     {name:"IBM Plex Sans", w:"400;500;600;700", note:"Corporate, technical"},
  manrope:  {name:"Manrope", w:"400;500;600;700", note:"Clean fintech look"},
  dmsans:   {name:"DM Sans", w:"400;500;600;700", note:"Light and airy"},
  worksans: {name:"Work Sans", w:"400;500;600;700", note:"Plain and sturdy"},
  noto:     {name:"Noto Sans", w:"400;500;600;700", note:"Wide language support"},
  jakarta:  {name:"Plus Jakarta Sans", w:"400;500;600;700", note:"Sharp, contemporary"},
  atkinson: {name:"Atkinson Hyperlegible", w:"400;700", note:"Built for low vision"},

  system:   {name:"System default", sys:true, note:"Your device's own font"},

const loadedFonts = new Set(["Figtree"]);
function loadFont(key) {
  const f = FONTS[key]; if (!f || f.sys || loadedFonts.has(f.name)) return; loadedFonts.add(f.name);
  const l = document.createElement("link"); l.rel = "stylesheet"; l.href = `https://fonts.googleapis.com/css2?family=${f.name.replace(/ /g, "+")}:wght@${f.w}&display=swap`; document.head.appendChild(l);
}
const hex2 = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mixHex = (a, b, t) => { const x = hex2(a), y = hex2(b); return "#" + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, "0")).join(""); };
const HC = {light: {good:"#0B5E3E", warn:"#7A4600", bad:"#9A1F17", neu:"#3F4D49", info:"#1C3F80"}, dark: {good:"#8BF0C4", warn:"#FFD08A", bad:"#FFB0A8", neu:"#D0DCD8", info:"#B9D0FF"}};

if (!SKINS[TH.skin]) TH.skin = "jade";
const root = document.documentElement; let hostTheme = root.getAttribute("data-theme"), weSet = false;

let applying = false;
function applyTheme() {
  applying = true;
  if (TH.mode === "system") { if (weSet) { if (hostTheme) root.setAttribute("data-theme", hostTheme); else root.removeAttribute("data-theme"); weSet = false; } }
  else { if (root.getAttribute("data-theme") !== TH.mode) root.setAttribute("data-theme", TH.mode); weSet = true; }
  const dark = isDark(), pal = {...SKINS[TH.skin][dark ? "dark" : "light"]}, far = dark ? "#ffffff" : "#000000";
  pal.ink = pal.ink || (dark ? "#E3EEEA" : "#10231F");
  const C = TH.contrast;
  if (C === "soft") { pal.muted = mixHex(pal.muted, pal.bg, .28); pal["side-muted"] = mixHex(pal["side-muted"], pal.side, .25); }
  if (C === "high" || C === "max") {
    const k = C === "max" ? 1 : .6;
    pal.ink = mixHex(pal.ink, far, k); pal.muted = mixHex(pal.muted, pal.ink, C === "max" ? .75 : .45); pal.line = mixHex(pal.line, pal.muted, C === "max" ? .5 : .3);
    pal["side-muted"] = mixHex(pal["side-muted"], pal["side-ink"], C === "max" ? .7 : .4); pal["side-ink"] = mixHex(pal["side-ink"], "#ffffff", k);

  Object.keys(HC.light).forEach(k => (C === "high" || C === "max") ? root.style.setProperty("--" + k, HC[dark ? "dark" : "light"][k]) : root.style.removeProperty("--" + k));
  root.dataset.density = TH.density; root.dataset.contrast = C;
  const f = FONTS[TH.font] || FONTS.figtree; loadFont(TH.font);
  const stack = f.sys ? `ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif` : `"${f.name}",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif`;
  root.style.setProperty("--f-body", stack);
  if (TH.headFont === "same") root.style.setProperty("--f-display", stack); else root.style.removeProperty("--f-display");
  applying = false;
}
const saveTheme = () => { try { localStorage.setItem("bcp-theme", JSON.stringify(TH)); } catch (e) {} };
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", applyTheme);
new MutationObserver(() => { const cur = root.getAttribute("data-theme"); if (TH.mode === "system") { hostTheme = cur; applyTheme(); } else if (cur !== TH.mode) { applyTheme(); } }).observe(root, {attributes: true, attributeFilter: ["data-theme"]});
applyTheme();

function openThemeDialog() {
  const before = {...TH};
  const sw = (k, s) => { const p = s[isDark() ? "dark" : "light"]; return `<button type="button" class="skin" data-skin="${k}" aria-pressed="${TH.skin === k}">
      <span class="pv" style="background:${p.bg}"><span class="sb" style="background:${p.side}"><i style="background:${p.accent}"></i><i style="background:${p["side-muted"]}"></i><i style="background:${p["side-muted"]}"></i></span>
      <span class="cv"><i style="background:${p.line};width:80%"></i><i style="background:${p.line};width:55%"></i><b style="background:${p.accent}"></b></span></span>
      <span class="nm">${s.name}<small>${s.mood}</small></span></button>`; };
  openDialog({
    eyebrow: "Personalise", title: "Theme & appearance", saveLabel: "Done",
    body: () => `
      <div class="field"><span class="lbl">Colour theme</span><div class="skins" id="th_skins">${Object.entries(SKINS).map(([k, s]) => sw(k, s)).join("")}</div></div>
      <div class="field"><span class="lbl">Appearance</span><div class="choices" id="th_mode">
        <button type="button" class="choice" data-v="light" aria-pressed="${TH.mode === "light"}"><b>Light</b><span>Bright workspace</span></button>
        <button type="button" class="choice" data-v="dark" aria-pressed="${TH.mode === "dark"}"><b>Dark</b><span>Easy on the eyes</span></button>
        <button type="button" class="choice" data-v="system" aria-pressed="${TH.mode === "system"}"><b>Match system</b><span>Follows your device</span></button></div></div>
      <div class="field"><span class="lbl">Density</span><div class="choices" id="th_den">
        <button type="button" class="choice" data-v="comfy" aria-pressed="${TH.density === "comfy"}"><b>Comfortable</b><span>Roomy rows</span></button>
        <button type="button" class="choice" data-v="compact" aria-pressed="${TH.density === "compact"}"><b>Compact</b><span>More rows on screen</span></button></div></div>
      <div class="field"><span class="lbl">Text contrast <span class="typ" id="th_cprev">Aa · ${esc(({soft:"Soft",std:"Standard",high:"High",max:"Maximum"})[TH.contrast])}</span></span><div class="choices" id="th_con">
        <button type="button" class="choice" data-v="soft" aria-pressed="${TH.contrast === "soft"}"><b>Soft</b><span>Gentle, low glare</span></button>
        <button type="button" class="choice" data-v="std" aria-pressed="${TH.contrast === "std"}"><b>Standard</b><span>Balanced</span></button>
        <button type="button" class="choice" data-v="high" aria-pressed="${TH.contrast === "high"}"><b>High</b><span>Darker text and lines</span></button>
        <button type="button" class="choice" data-v="max" aria-pressed="${TH.contrast === "max"}"><b>Maximum</b><span>Black on white, bold statuses</span></button></div></div>
      <div class="field"><span class="lbl">Font</span><div class="fontgrid" id="th_font">${Object.entries(FONTS).map(([k, f]) => `<button type="button" class="choice fontc" data-v="${k}" aria-pressed="${TH.font === k}"><b style="font-family:${f.sys ? "system-ui" : `'${f.name}'`},system-ui;font-size:17px;font-weight:600">${esc(f.name)}</b><span style="font-family:${f.sys ? "system-ui" : `'${f.name}'`},system-ui;font-size:13px;color:var(--ink)">Login API fails · 21 Sep</span><span>${esc(f.note)}</span></button>`).join("")}</div></div>
      <div class="field"><span class="lbl">Headings</span><div class="choices" id="th_head">
        <button type="button" class="choice" data-v="display" aria-pressed="${TH.headFont !== "same"}"><b style="font-family:'Bricolage Grotesque'">Display font</b><span>Bold, characterful headings</span></button>
        <button type="button" class="choice" data-v="same" aria-pressed="${TH.headFont === "same"}"><b>Same as text</b><span>One font everywhere</span></button></div></div>
      <span class="hint">Your theme is saved in this browser and doesn't change what teammates see.</span>`,
    mount: root2 => {
      const refreshSwatches = () => { const g = root2.querySelector("#th_skins"); g.innerHTML = Object.entries(SKINS).map(([k, s]) => sw(k, s)).join(""); };
      root2.querySelector("#th_skins").addEventListener("click", e => { const b = e.target.closest("[data-skin]"); if (!b) return; TH.skin = b.dataset.skin; applyTheme(); refreshSwatches(); });
      const m = root2.querySelector("#th_mode"); pressGroup(m, ".choice", "v"); m.addEventListener("pick", () => { TH.mode = m.dataset.v; applyTheme(); refreshSwatches(); });
      const d = root2.querySelector("#th_den"); pressGroup(d, ".choice", "v"); d.addEventListener("pick", () => { TH.density = d.dataset.v; applyTheme(); });
      const cn = root2.querySelector("#th_con"); pressGroup(cn, ".choice", "v"); cn.addEventListener("pick", () => { TH.contrast = cn.dataset.v; applyTheme(); root2.querySelector("#th_cprev").textContent = "Aa · " + ({soft:"Soft",std:"Standard",high:"High",max:"Maximum"})[TH.contrast]; });
      const fg = root2.querySelector("#th_font"); pressGroup(fg, ".choice", "v"); fg.addEventListener("pick", () => { TH.font = fg.dataset.v; applyTheme(); });
      const hd = root2.querySelector("#th_head"); pressGroup(hd, ".choice", "v"); hd.addEventListener("pick", () => { TH.headFont = hd.dataset.v; applyTheme(); });
      if (!document.getElementById("fontPreviewCss")) { const l = document.createElement("link"); l.id = "fontPreviewCss"; l.rel = "stylesheet"; l.href = "https://fonts.googleapis.com/css2?" + Object.values(FONTS).filter(f => !f.sys).map(f => "family=" + f.name.replace(/ /g, "+") + ":wght@" + (f.w.includes("600") ? "400;600" : "400;700")).join("&") + "&text=" + encodeURIComponent("ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789·") + "&display=swap"; document.head.appendChild(l); }

try { S.layout = JSON.parse(localStorage.getItem("bcp-layout") || "{}") || {}; } catch (e) {}
try { S.noside = localStorage.getItem("bcp-noside") === "1"; } catch (e) {}
function applySide() { document.querySelector(".app").classList.toggle("noside", !!S.noside); }
const narrow = () => matchMedia("(max-width:1024px)").matches;
function closeSideDrawer() { document.querySelector(".app").classList.remove("sideopen"); }
function toggleSide() { if (narrow()) { document.querySelector(".app").classList.toggle("sideopen"); return; } S.noside = !S.noside; try { localStorage.setItem("bcp-noside", S.noside ? "1" : "0"); } catch (e) {} applySide(); render(); toast(S.noside ? "Side menu hidden. Press [ or the menu button to bring it back" : "Side menu shown"); }
applySide();
let fsActive = false;
function applyFull() { document.querySelector(".app").classList.toggle("full", !!S.full); render(); }
function toggleFull() {
  S.full = !S.full;
  if (S.full) { try { const pr = document.documentElement.requestFullscreen?.(); if (pr?.catch) pr.catch(() => toast("Full-screen view on. Press Esc or F to exit")); else toast("Full-screen view on. Press Esc or F to exit"); } catch (e) { toast("Full-screen view on. Press Esc or F to exit"); } }

/* ---------- Drag to reorder: sheet tabs and columns ---------- */
let DRAG = null;

  const t = e.target.closest?.("[data-dragsheet],[data-dragcol]"); if (!t) return;
  DRAG = t.dataset.dragsheet ? {kind: "sheet", id: t.dataset.dragsheet} : {kind: "col", id: t.dataset.dragcol};
  t.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", DRAG.id); } catch (x) {}
  closeColMenu();
});
document.addEventListener("dragover", e => {
  if (!DRAG) return; const t = e.target.closest?.(DRAG.kind === "sheet" ? "[data-dragsheet]" : "[data-dragcol]"); if (!t) return;

  if (!DRAG) return; const t = e.target.closest?.(DRAG.kind === "sheet" ? "[data-dragsheet]" : "[data-dragcol]"); if (!t) { clearDrop(); DRAG = null; return; }

      const to = cs.findIndex(c => c.id === target) + (right ? 1 : 0); cs.splice(to, 0, moved);

    }

init();
})();
